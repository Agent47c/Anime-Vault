<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom entry drawer – AnimeVault</title>
<link rel="stylesheet" href="shared.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@700&display=swap">
<style>
body{margin:0}
</style>

</head>
<body>

<div class="ov">
<div class="bk" aria-hidden="true"><i style="--h:262"></i><i style="--h:200"></i><i style="--h:340"></i><i style="--h:28"></i><i style="--h:150"></i><i style="--h:10"></i><i style="--h:300"></i><i style="--h:45"></i><i style="--h:180"></i><i style="--h:320"></i><i style="--h:120"></i><i style="--h:220"></i><i style="--h:80"></i><i style="--h:262"></i></div>
<div class="dr" role="dialog" aria-modal="true" aria-labelledby="t">
<header class="dh" data-k="追加"><div><h2 id="t">Add custom entry</h2><p>Keep unmatched anime in your library with your own details</p></div><button class="x" type="button" aria-label="Close custom entry drawer">×</button></header>
<div class="db">
<label class="fl" for="ti" style="margin-top:0">Display title</label><input class="in" id="ti" type="text" placeholder="English title">
<p class="fl">Poster artwork</p>
<div style="display:flex;gap:20px;align-items:flex-end"><div class="pv">No image yet</div><div style="display:grid;gap:10px"><button class="btn" type="button">Choose image</button><button class="btn" type="button">Grab episode 1 frame</button></div></div>
<label class="fl" for="ws">Watch status</label><select class="in" id="ws"><option>Watched</option><option>Watching</option><option>Plan to watch</option><option>Dropped</option></select>
<label class="fl" for="nt">Notes</label><textarea class="in" id="nt" placeholder="Optional"></textarea>
<div class="note">Custom entries are skipped when you refresh metadata, because there is nothing to look up.</div></div>
<footer class="df"><button class="btn" type="button">Cancel</button><button class="btn p" type="button">Save entry</button></footer></div>
</div>

</body>
</html>
