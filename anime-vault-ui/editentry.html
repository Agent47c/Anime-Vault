<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit entry drawer – AnimeVault</title>
<link rel="stylesheet" href="shared.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@700&display=swap">
<style>
body{margin:0}
</style>

</head>
<body>

<div class="ov">
<div class="bk" aria-hidden="true"><i style="--h:262"></i><i style="--h:200"></i><i style="--h:340"></i><i style="--h:28"></i><i style="--h:150"></i><i style="--h:10"></i><i style="--h:300"></i><i style="--h:45"></i><i style="--h:180"></i><i style="--h:320"></i><i style="--h:120"></i><i style="--h:220"></i><i style="--h:80"></i><i style="--h:262"></i></div>
<div class="dr" role="dialog" aria-modal="true" aria-labelledby="t">
<header class="dh" data-k="詳細"><div><h2 id="t">Edit anime entry</h2><p>Update titles, details and artwork in your library.</p></div><button class="x" type="button" aria-label="Close edit drawer">×</button></header>
<div class="db">
<section class="pn" aria-labelledby="e1" style="padding:18px 20px"><h2 id="e1" style="font-size:15px">Title information</h2><label class="fl" for="dt">Display title</label><input class="in" id="dt" type="text" value="Solo Leveling"><label class="fl" for="et">English title</label><input class="in" id="et" type="text" value="Solo Leveling"><label class="fl" for="rt">Romaji title</label><input class="in" id="rt" type="text" value="Ore dake Level Up na Ken"><label class="fl" for="jt">Japanese title</label><input class="in" id="jt" type="text" value="俺だけレベルアップな件"></section>
<section class="pn" aria-labelledby="e2" style="padding:18px 20px"><h2 id="e2" style="font-size:15px">Details</h2><label class="fl" for="sy">Synopsis</label><textarea class="in" id="sy">A hunter who was considered the weakest gains access to a mysterious system that allows him to level up.</textarea><label class="fl" for="gn">Genres (comma separated)</label><input class="in" id="gn" type="text" value="Action, Adventure, Fantasy"><label class="fl" for="ws">Watch status</label><select class="in" id="ws"><option>Watching</option><option>Watched</option><option>Plan to watch</option><option>Dropped</option></select><label class="fl" for="rg">Rating</label><select class="in" id="rg"><option>No rating</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select><label class="fl" for="nt">Notes</label><textarea class="in" id="nt" placeholder="Personal notes"></textarea></section>
<section class="pn" aria-labelledby="e3" style="padding:18px 20px"><h2 id="e3" style="font-size:15px">Cover image</h2><div style="display:flex;gap:20px;align-items:flex-end"><div class="pv" style="border:0;color:#fff;font:700 56px Noto Serif JP,serif;background:linear-gradient(160deg,hsl(262 55% 40%),hsl(302 60% 16%))" role="img" aria-label="Current cover">俺</div><div style="display:grid;gap:10px"><button class="btn" type="button">Choose image</button><button class="btn" type="button">Grab episode 1 frame</button></div></div></section>
</div>
<footer class="df"><button class="btn" type="button">Cancel</button><button class="btn p" type="button">Save entry</button></footer></div>
</div>

</body>
</html>
