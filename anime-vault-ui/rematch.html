<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rematch drawer – AnimeVault</title>
<link rel="stylesheet" href="shared.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@700&display=swap">
<style>
body{margin:0}
</style>

</head>
<body>

<div class="ov">
<div class="bk" aria-hidden="true"><i style="--h:262"></i><i style="--h:200"></i><i style="--h:340"></i><i style="--h:28"></i><i style="--h:150"></i><i style="--h:10"></i><i style="--h:300"></i><i style="--h:45"></i><i style="--h:180"></i><i style="--h:320"></i><i style="--h:120"></i><i style="--h:220"></i><i style="--h:80"></i><i style="--h:262"></i></div>
<div class="dr" role="dialog" aria-modal="true" aria-labelledby="t">
<header class="dh" data-k="照合"><div><h2 id="t">Rematch anime</h2><p>Search AniList and replace the linked metadata only</p></div><button class="x" type="button" aria-label="Close rematch drawer">×</button></header>
<div class="db">
<p class="fl" style="margin-top:0">Currently linked</p>
<div class="note" style="margin:0 0 4px"><b>Fate Strange Fake</b><br>D:\Anime\Fate Strange Fake · 6 files</div>
<label class="fl" for="sq">Search AniList</label><input class="in" id="sq" type="search" value="Fate strange Fake">
<p class="fl">Results</p>
<div class="ml" role="radiogroup" aria-label="AniList results">
<label class="cd"><input type="radio" name="m" checked><span class="th" style="--h:300" aria-hidden="true"></span><span><b>Fate/strange Fake</b><small>フェイト／ストレンジ Fake · 2024 · TV</small></span><span class="pl ok">96% match</span></label>
<label class="cd"><input type="radio" name="m"><span class="th" style="--h:220" aria-hidden="true"></span><span><b>Fate/stay night</b><small>フェイト／ステイナイト · 2006 · TV</small></span><span class="pl wn">72% match</span></label>
<label class="cd"><input type="radio" name="m"><span class="th" style="--h:180" aria-hidden="true"></span><span><b>Fate/Grand Order</b><small>フェイト／グランドオーダー · 2016 · OVA</small></span><span class="pl dg">41% match</span></label>
</div>
<div class="note"><b>Your folder name stays unchanged.</b> Only the AniList ID, poster, display title and metadata link will change.</div></div>
<footer class="df"><button class="btn" type="button">Cancel</button><button class="btn p" type="button">Apply match</button></footer></div>
</div>

</body>
</html>
