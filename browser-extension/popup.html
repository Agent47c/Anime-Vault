<!doctype html>
<html><head><meta charset="utf-8"><title>Anime Vault site capture</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>Anime Vault</h1><p>Catch magnet clicks on one selected website. Other websites keep their usual handler.</p>
<label for="site">Download website</label><input id="site" type="url" value="https://nyaa.si" placeholder="https://example.org">
<button id="enable">Enable on this website</button><button id="disable" class="secondary">Disable capture</button>
<p id="status" role="status"></p><p class="hint">Copy the extension ID from chrome://extensions into Anime Vault → Settings → Downloads, then connect it. Reload the selected website after enabling.</p>
<script src="logic.js"></script><script src="popup.js"></script></body></html>
